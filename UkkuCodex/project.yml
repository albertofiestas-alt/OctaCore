name: UkkuCodex
options:
  bundleIdPrefix: com.hackathon
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios.git
    exactVersion: 6.30.1
targets:
  UkkuCodex:
    dependencies:
      - package: RiveRuntime
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Personaje
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Ukku Codex
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: es
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackathon.ukku.codex
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  UkkuCodexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: UkkuCodex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: UkkuCodex
schemes:
  UkkuCodex:
    build:
      targets:
        UkkuCodex: all
        UkkuCodexUITests: [test]
    test:
      targets: [UkkuCodexUITests]
