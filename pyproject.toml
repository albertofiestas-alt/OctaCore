[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octacore"
version = "0.0.0"
description = "Hackathon BBVA AI Financial Life: cuánto puedo gastar hoy sin fallar a un pago con fecha"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -ra --import-mode=importlib"
