# config/preregistro.yaml  (dueño: Gino). Se lee como cfg["preregistro"].
# ESTRUCTURA SOLA: todo en null. Gino fija cada número A MANO a las 12:00 y lo commitea
# en UN solo commit, con la hora visible en git log, ANTES de cualquier `make eval`.
# Después de ver resultados, cambiar algo de aquí exige declararlo en DECISIONES.md.
# Mientras haya null en un campo que la regla usa, eval/adopcion.py falla con "pre-registro pendiente".

# Mejora mínima de gasto permitido (soles/día, absoluto) del modelo sobre regla2,
# a igual % de pagos descubiertos, en la prueba Y en el perturbado.
umbral_adopcion_mejora: 2.0

# Cuantil de regla2 que fija el % de descubiertos de referencia para la comparación.
cuantil_conservador: 0.20

colchon: 0                     # soles
umbral_historia_semanas: 4     # con menos historia: confianza baja, sin propuestas
umbrales_confianza: {ancho_alto: 0.5, ancho_bajo: 1.2}          # {ancho_alto: x, ancho_bajo: y}
umbral_alerta_sesgo: 0.05         # brecha máxima aceptable entre grupos
semillas_evaluacion: 20         # cantidad de semillas (20 o más)
