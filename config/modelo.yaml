# Hiperparámetros del modelo de cuantiles (dueño: Gino). Se leen como cfg["modelo"][...].
# Valores iniciales del plan; solo se ajustan con la validación (no con la prueba) y se anotan en DECISIONES.md.
n_estimators: 200
learning_rate: 0.05
num_leaves: 15
min_child_samples: 50
paso_muestreo_dias: 3        # una muestra por persona cada N días
ventana_corta_dias: 28       # ingreso_28d, n_ingresos_28d, mediana_ingreso_dia_28d
ventana_larga_dias: 56       # ingreso_56d
